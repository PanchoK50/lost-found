[project]
name = "track01-student-kit"
version = "1.1.0"
description = "Track 01 Google Maps for Every Building: starter agent and scorer"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "shapely>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["starter_agent", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
